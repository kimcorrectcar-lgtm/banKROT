services:
  - type: web
    name: bankrot-bot
    runtime: python

    buildCommand: python3 -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -r requirements.txt

    startCommand: .venv/bin/python main.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: PORT
        value: 10000
